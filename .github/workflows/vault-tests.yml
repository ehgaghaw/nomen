name: vault-tests
on:
  push:
    branches: [master]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node scripts/build.mjs
      - name: Winternitz signer vs Blueshift golden fixtures
        run: node scripts/test-winter.mjs
      - name: Vault lifecycle on the real mainnet WinterWallet binary (LiteSVM)
        run: node scripts/test-litesvm.mjs
